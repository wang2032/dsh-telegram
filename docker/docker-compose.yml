# Teleforge (dsh-telegram) × DeepSeek Harness — docker compose test stack.
#
# Deploys the DSH Web UI with the dsh-telegram plugin (long-polling mode).
# The plugin uses getUpdates long-polling, so NO public HTTPS URL or webhook
# registration is required — the container only needs outbound access to
# api.telegram.org (verify: curl -s https://api.telegram.org/bot<TOKEN>/getMe).
#
# Usage (from this repo root):
#   export TELEGRAM_BOT_TOKEN='123:ABC...'            # from @BotFather
#   export DEEPSEEK_API_KEY='sk-...'                  # agent model credentials
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f teleforge
#
# The bot token and LLM keys are read by DSH's credentials domain, whose
# highest-precedence source is the inherited container environment. Keys can
# also be set later in the Web UI (Models page) and persist in the volume.
#
# Verification (bot is polling):
#   curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates"
#   # expect error_code 409 "terminated by other getUpdates request" — proves
#   # the container's poller is alive. Then message the bot from your phone.

services:
  teleforge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: teleforge-dsh
    container_name: teleforge-dsh
    restart: unless-stopped
    environment:
      # Bot token (read via DSH credentials domain -> TELEGRAM_BOT_TOKEN env).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # LLM provider credentials the agent needs to answer chat messages.
      # Pass through whichever provider you use; unused ones stay empty.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Point the DeepSeek route at a custom/relay endpoint (empty = official).
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # 127.0.0.1 on the server host ONLY — the DSH web UI is never exposed to
      # the public internet. Access from your laptop through an SSH tunnel:
      #   ssh -L 13080:127.0.0.1:3080 root@<server>
      #   browser -> http://127.0.0.1:13080
      # (Telegram needs no inbound ports at all: the plugin long-polls out.)
      - "127.0.0.1:3080:3080"
    volumes:
      # Persist the DSH home (profiles, sessions, credentials) across restarts.
      - teleforge-home:/dsh-home

volumes:
  teleforge-home:
