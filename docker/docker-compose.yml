# Teleforge (dsh-telegram) × DeepSeek Harness — docker compose test stack.
#
# Deploys the DSH Web UI with the dsh-telegram plugin active, exposes :3080.
# Telegram webhooks need a PUBLIC HTTPS URL; from this test host either publish
# 3080 and front it with HTTPS (reverse proxy / self-signed cert + scripts
# in ./scripts), or point a tunnel (cloudflared/ngrok) at this service.
#
# Usage (from this repo root):
#   export TELEGRAM_BOT_TOKEN='123456:ABC...DEF'     # valid-format token
#   export TELEGRAM_PUBLIC_URL='https://your-host'   # public base for webhook
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f teleforge
#
# Verification (plugin loads + webhook route registers):
#   docker compose -f docker/docker-compose.yml exec teleforge \
#     sh -c 'curl -sI -X POST http://127.0.0.1:3080/telegram/webhook | head -1'
#   # expect HTTP/1.1 403 (route exists; wrong/missing secret) — proves the
#   # webhook route is registered. See docker/README.md for the full walkthrough.

services:
  teleforge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: teleforge-dsh
    container_name: teleforge-dsh
    restart: unless-stopped
    environment:
      # botToken must be valid-format or the plugin idles (webhook not registered).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_PUBLIC_URL: ${TELEGRAM_PUBLIC_URL:-}
      TELEGRAM_ALLOW_USERS: ${TELEGRAM_ALLOW_USERS:-}
      TELEGRAM_ALLOW_CHATS: ${TELEGRAM_ALLOW_CHATS:-}
      TELEGRAM_PARSE_MODE: ${TELEGRAM_PARSE_MODE:-None}
      # Optional LLM route for the web profile (set to a provider/model your DSH deployments use).
      # DSH_LLM_PROVIDER: ${DSH_LLM_PROVIDER:-}
      # DSH_LLM_MODEL: ${DSH_LLM_MODEL:-}
    ports:
      - "3080:3080"
    volumes:
      # Persist the DSH home (profiles, sessions, credentials) across restarts.
      - teleforge-home:/dsh-home

volumes:
  teleforge-home:
