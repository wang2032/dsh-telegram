# 自定义 DeepSeek 兼容中转 → 接入 DSH(llm-pi-ai 自定义路由)
#
# 安装步骤(服务器):
#   1. 改下面 baseURL 为你中转站的地址(OpenAI 兼容端点,通常以 /v1 结尾)
#   2. 写进容器的 DSH home(settings.yaml 是热加载的,DSH 会秒级生效、无需重启):
#        docker exec -i teleforge-dsh sh -c 'cat > /dsh-home/settings.yaml' \
#          < docker/settings.deepseek-relay.example.yaml
#   3. 中转 key 走环境变量(compose 已透传 DEEPSEEK_API_KEY):
#        export TELEGRAM_BOT_TOKEN='88...:AAH...'      # BotFather 的真实 token
#        export DEEPSEEK_API_KEY='sk-你的中转key'
#        docker compose -f docker/docker-compose.yml up -d
#   4. 手机 Telegram 对 bot 发送 /model,选 my-deepseek 下的模型。
#
# 原理:DSH 监听 $DSH_HOME/settings.yaml;`llm-pi-ai:` 一节挂载自定义 provider
# 路由,apiKeyEnv 指向的凭据名按请求从容器环境解析(这正是 Web UI Models 页
# 背后的机制)。models 手写清单是最稳的路径(不依赖 /models 自动发现)。
# 注意:settings.yaml 在卷里,重建容器不会丢;改 baseURL 后要重新执行第 2 步。

llm-pi-ai:
  providers:
    my-deepseek:
      displayName: My DeepSeek Relay
      api: openai-completions
      baseURL: https://REPLACE-WITH-YOUR-GATEWAY/v1
      apiKeyEnv: DEEPSEEK_API_KEY
      models:
        - id: deepseek-chat
          name: DeepSeek Chat
          contextWindow: 131072
          maxTokens: 8192
        - id: deepseek-reasoner
          name: DeepSeek Reasoner
          contextWindow: 131072
          maxTokens: 8192
