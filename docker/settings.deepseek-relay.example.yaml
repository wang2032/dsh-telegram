# 自定义 DeepSeek 兼容中转 → 接入 DSH(llm-pi-ai 自定义路由)
# 适配 relay: https://maas-test.10rig.com/v1(已实测 deepseek-v4-flash 可用)
#
# 安装步骤(服务器):
#   1. 写入容器的 DSH home(settings.yaml 热加载,秒级生效、无需重启):
#        docker exec -i teleforge-dsh sh -c 'cat > /dsh-home/settings.yaml' \
#          < docker/settings.deepseek-relay.example.yaml
#   2. key 走环境变量(compose 已透传 DEEPSEEK_API_KEY):
#        export TELEGRAM_BOT_TOKEN='88...:AAH...'
#        export DEEPSEEK_API_KEY='sk-你的中转key'
#        docker compose -f docker/docker-compose.yml up -d
#   3. 手机 Telegram 对 bot 发送 /model,选 My DeepSeek Relay 下的模型。
#
# 说明:
# - DSH 监听 $DSH_HOME/settings.yaml;`llm-pi-ai:` 一节挂载自定义 provider 路由,
#   apiKeyEnv 指向的凭据名按请求从容器环境解析(这正是 Web UI Models 页的机制)。
# - `telegram:` 一节是 dsh-telegram 插件的运行时设置(热加载):allowedUsers
#   为白名单(填你自己的 Telegram 用户 id;整节删掉 = 所有人可聊)。
# - 模型 id 必须与 relay 的 /models 列表一致,否则报"无可用渠道"。
#   本 relay 实测可用:deepseek-v4-flash(思考模型)、qwen3.8-flash、glm-5.3-flash。
# - 不写 compat:字段,交给 DSH 默认处理;思考过程若不显示不影响回答。

llm-pi-ai:
  providers:
    my-deepseek:
      displayName: My DeepSeek Relay
      api: openai-completions
      baseURL: https://maas-test.10rig.com/v1
      apiKeyEnv: DEEPSEEK_API_KEY
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 131072
          maxTokens: 8192
        - id: qwen3.8-flash
          name: Qwen 3.8 Flash
          contextWindow: 131072
          maxTokens: 8192
        - id: glm-5.3-flash
          name: GLM 5.3 Flash
          contextWindow: 131072
          maxTokens: 8192

telegram:
  allowedUsers:
    - "8482302332"
